<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stargazer Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--cherry:#c8102e;--deep:#3a0a1a;--blush:#ffd9e2;--cream:#fff4f0;--lav:#b9a3e3;--ink:#2a0712;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%;background:var(--deep);color:var(--cream);font-family:"Press Start 2P",ui-monospace,monospace;font-size:10px;line-height:1.8}
#app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;max-width:540px;margin:0 auto}
#hud{width:100%;display:flex;justify-content:space-between;align-items:center}
canvas{width:100%;image-rendering:pixelated;border:4px solid var(--cherry);border-radius:6px;background:var(--blush);touch-action:none}
#box{width:100%;box-sizing:border-box;min-height:96px;background:var(--cream);color:var(--ink);border:4px solid var(--cherry);border-radius:6px;padding:12px;cursor:pointer}
#pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px;margin-top:4px}
button{font:inherit;background:var(--cherry);color:var(--cream);border:0;border-radius:6px;cursor:pointer;padding:8px 10px}
button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
#pad button{font-size:16px;padding:0}
#pad .u{grid-column:2}#pad .l{grid-row:2;grid-column:1}#pad .d{grid-row:2;grid-column:2}#pad .r{grid-row:2;grid-column:3}
#title{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;z-index:5}
#title h1{font-size:22px;line-height:1.5;margin:0;color:var(--blush)}
#title p{margin:0;color:var(--lav)}
#title .lily{font-size:44px}
#dex{position:fixed;inset:0;background:rgba(58,10,26,.96);display:none;flex-direction:column;gap:12px;padding:24px;z-index:4;overflow:auto}
#dex.on{display:flex}
#dex div{background:var(--cream);color:var(--ink);border-radius:6px;padding:10px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="title"><div class="lily">✿</div><h1>Stargazer<br>Quest</h1><p>a game made for xie_comm</p><button id="start">PRESS START</button></div>
<div id="dex"><b>MEMORY DEX</b><div id="dexlist"></div><button id="dexclose">BACK</button></div>
<div id="app">
<div id="hud"><span id="count">Memories 0/6</span><button id="dexbtn">DEX</button></div>
<canvas id="c" width="520" height="360" aria-label="Game map"></canvas>
<div id="box" role="button" tabindex="0">Walk to the glowing hearts. Use arrow keys, WASD, or the pad below.</div>
<div id="pad"><button class="u" data-d="0,-1" aria-label="Up">▲</button><button class="l" data-d="-1,0" aria-label="Left">◀</button><button class="d" data-d="0,1" aria-label="Down">▼</button><button class="r" data-d="1,0" aria-label="Right">▶</button></div>
</div>
<script>
// ===== EDIT YOUR MEMORIES HERE =====
var MEM={
 1:{t:"The Coincidence",l:["Dude..... its so random right, how we met","Do you believe in fate?","if we werent playing at teh same time we wouldnt have met"]},
 2:{t:"First Call",l:["our first call.","my heart was pounding so hard i could barely talk.","i kept hoping you couldn’t hear it through the phone.","okay that is kinda embarasing"]},
 3:{t:"Always Right",l:["So apparantly your always right huh?","so yeah you win. again. like always","(am not even mad :>)"]},
 4:{t:"Bhondu",l:["you call me bhondu and i act like it annoys me.","it doesn’t. it’s honestly my favorite thing you call me.","pls never stop."]},
 5:{t:"Mole Count",l:["The most random thing ik about you is that you have 41 moles and counting","thats something i guess","(id lowk kiss all of them :3)"]},
 6:{t:"Secret: Classmates",l:["when you told me you’d talked to your classmates about me, i tried to play it cool.","i was so calm about it. very chill. 10/10 acting.","but the truth is all i’ve been talking about is you.","my classmates were completely done with me."]}
};
var LETTER=["(the ghost was me. sorry for chasing you.)","the gate’s open. lilies everywhere, since i know they’re your favorite.","i still can’t believe a random roblox server led me to you.","being this far from you sucks sometimes. but you’re worth every mile.","i love you, xie_comm.","— your bhondu ♥","★ you received: one bhondu. no returns. ★"];
// ===================================
var T=40,map=["TTTTTTTTTTTTT","T1....T....2T","T..TT.T.TT..T","T5.........6T","T.TT.....TT.T","T...........T","T3..TT.TT..4T","T...........T","TTTTTTLTTTTTT"];
var cv=document.getElementById("c"),x=cv.getContext("2d"),box=document.getElementById("box");
var px=6,py=4,face=1,got=0,done={},dlg=null,typing=false,txt="",shown=0,after=null,started=false,fin=false,petals=[];
function say(lines,cb){dlg=lines.slice();after=cb||null;next()}
function next(){
 if(typing){shown=txt.length;box.textContent=txt;typing=false;return}
 if(!dlg||!dlg.length){dlg=null;box.textContent="";grace=Date.now()+700;if(after){var f=after;after=null;f()}return}
 txt=dlg.shift();shown=0;typing=true;tick()}
function tick(){if(!typing)return;shown++;box.textContent=txt.slice(0,shown);if(shown>=txt.length){typing=false;return}setTimeout(tick,22)}
function move(dx,dy){
 if(!started||dlg||Date.now()-last<130)return;last=Date.now();face=dx||face;
 var nx=px+dx,ny=py+dy,t=map[ny][nx];if(t==="T")return;
 if(t==="L"&&got<6){say(["The lily gate is locked.","Collect all 6 memories to open it."]);return}
 px=nx;py=ny;if(caught())return;
 if(t>="1"&&t<="6"&&!done[t]){done[t]=1;got++;document.getElementById("count").textContent="Memories "+got+"/6";
  say(["New memory: "+MEM[t].t].concat(MEM[t].l),function(){if(got===6)say(["All 6 memories collected!","Something is blooming at the bottom of the map..."])})}
 else if(t==="L"){fin=true;for(var i=0;i<30;i++)petals.push({x:Math.random()*520,y:-Math.random()*360,s:1+Math.random()*1.5,r:Math.random()*6});say(LETTER)}
}
document.addEventListener("keydown",function(e){var k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
 if(m){e.preventDefault();move(m[0],m[1])}else if(k==="enter"||k===" "){if(e.target.tagName!=="BUTTON"){e.preventDefault();if(dlg||typing)next()}}});
box.addEventListener("click",function(){if(dlg||typing)next()});
document.querySelectorAll("#pad button").forEach(function(b){var d=b.dataset.d.split(",").map(Number),iv;
 b.addEventListener("pointerdown",function(e){e.preventDefault();if(dlg){next();return}move(d[0],d[1]);iv=setInterval(function(){move(d[0],d[1])},170)});
 ["pointerup","pointerleave","pointercancel"].forEach(function(n){b.addEventListener(n,function(){clearInterval(iv)})})});
document.getElementById("start").onclick=function(){document.getElementById("title").style.display="none";started=true;
 say(["hi xie_comm!","somewhere in this garden are 6 of our memories.","find them all and the lily gate will open.","I am the ghost because you told me your scared of me. so boo or whatever"])};
function dex(on){var l=document.getElementById("dexlist");l.innerHTML="";var any=0;
 for(var i=1;i<=6;i++)if(done[i]){any=1;var d=document.createElement("div");d.textContent="♥ "+MEM[i].t+": "+MEM[i].l[0];l.appendChild(d)}
 if(!any)l.textContent="No memories yet. Go find some!";document.getElementById("dex").classList.toggle("on",on)}
document.getElementById("dexbtn").onclick=function(){dex(true)};document.getElementById("dexclose").onclick=function(){dex(false)};
function lily(cx,cy,r){for(var i=0;i<6;i++){x.save();x.translate(cx,cy);x.rotate(i*Math.PI/3);x.fillStyle="#ff8fb1";x.strokeStyle="#fff4f0";x.lineWidth=1.5;x.beginPath();x.ellipse(0,-r*.55,r*.3,r*.6,0,0,7);x.fill();x.stroke();x.strokeStyle="#c8102e";x.beginPath();x.moveTo(0,-r*.2);x.lineTo(0,-r*.9);x.stroke();x.restore()}
 x.fillStyle="#7a1230";for(var j=0;j<5;j++){x.fillRect(cx+Math.cos(j*1.26)*r*.25-1,cy+Math.sin(j*1.26)*r*.25-1,3,3)}}
function draw(){
 var now=Date.now();x.clearRect(0,0,520,360);
 for(var r=0;r<9;r++)for(var c=0;c<13;c++){var t=map[r][c],X=c*T,Y=r*T;
  x.fillStyle=(r+c)%2?"#ffd9e2":"#ffcfdb";x.fillRect(X,Y,T,T);
  if(t==="T"){x.fillStyle="#7a1230";x.fillRect(X,Y,T,T);x.fillStyle="#a3173f";x.fillRect(X+3,Y+3,T-6,T-14);x.fillStyle="#ff8fb1";x.fillRect(X+10,Y+9,4,4);x.fillRect(X+24,Y+16,4,4)}
  else if(t>="1"&&t<="6"){var p=Math.sin(now/300)*3;x.fillStyle=done[t]?"#e6b8c6":"#c8102e";x.beginPath();x.arc(X+20,Y+20,done[t]?9:12+p,0,7);x.fill();x.fillStyle="#fff4f0";x.font="14px sans-serif";x.textAlign="center";x.fillText(done[t]?"✓":"♥",X+20,Y+25)}
  else if(t==="L"){if(got<6){x.fillStyle="#b9a3e3";x.fillRect(X,Y,T,T);x.fillStyle="#fff4f0";x.fillRect(X+8,Y+6,4,28);x.fillRect(X+28,Y+6,4,28);x.fillRect(X+8,Y+18,24,4)}else{x.fillStyle="#ffd9e2";x.fillRect(X,Y,T,T);lily(X+20,Y+20,16+Math.sin(now/400)*2)}}}
 if(got===6&&!fin){x.save();x.globalAlpha=.5+.5*Math.sin(now/250);x.strokeStyle="#c8102e";x.lineWidth=3;x.strokeRect(6*T+2,8*T+2,T-4,T-4);x.restore()}
 var X=px*T,Y=py*T;x.fillStyle="#b9a3e3";x.fillRect(X+11,Y+18,18,16);x.fillStyle="#fff4f0";x.fillRect(X+12,Y+6,16,14);x.fillStyle="#2a0712";x.fillRect(X+16,Y+12,3,3);x.fillRect(X+23,Y+12,3,3);x.fillStyle="#c8102e";x.fillRect(X+8,Y+4,8,6);x.fillRect(X+24,Y+4,8,6);x.fillRect(X+17,Y+5,6,4);
 if(!fin)ghostDraw();if(fin){petals.forEach(function(q){q.y+=q.s;q.x+=Math.sin(now/600+q.r);if(q.y>370){q.y=-10;q.x=Math.random()*520}x.fillStyle="#ff8fb1";x.beginPath();x.ellipse(q.x,q.y,5,3,q.r,0,7);x.fill()})}
 requestAnimationFrame(draw)}
var gx=11,gy=7,hits=0,grace=0,last=0;
function caught(){if(fin||dlg||gx!==px||gy!==py)return false;var L=[["Haha caught you cause ur so fat"],["Again? are you running into me cause you love me so much?"],["I dont even wanna catch you anymore i feel bad"]];var encounter=hits%3;say(L[encounter],function(){grace=Date.now()+2500});hits++;px=6;py=4;gx=11;gy=7;return true}
function free(c,r){var t=map[r]&&map[r][c];return !!t&&t!=="T"&&t!=="L"}
function ghostStep(){if(started&&!dlg&&!fin&&Date.now()>grace){var dirs=[[1,0],[-1,0],[0,1],[0,-1]],best=null;
 if(hits>=3){var q=[[gx,gy,null]],seen={};seen[gx+","+gy]=1;while(q.length){var n=q.shift();if(n[0]===px&&n[1]===py){best=n[2];break}for(var i=0;i<4;i++){var d=dirs[i],cx=n[0]+d[0],cy=n[1]+d[1],key=cx+","+cy;if(free(cx,cy)&&!seen[key]){seen[key]=1;q.push([cx,cy,n[2]||d])}}}}else if(Math.random()<.2){var o=dirs.filter(function(d){return free(gx+d[0],gy+d[1])});best=o[Math.floor(Math.random()*o.length)]}
 else{var q=[[gx,gy,null]],seen={};seen[gx+","+gy]=1;
  while(q.length){var n=q.shift();if(n[0]===px&&n[1]===py){best=n[2];break}
   for(var i=0;i<4;i++){var d=dirs[i],cx=n[0]+d[0],cy=n[1]+d[1],key=cx+","+cy;if(free(cx,cy)&&!seen[key]){seen[key]=1;q.push([cx,cy,n[2]||d])}}}}
 if(best){gx+=best[0];gy+=best[1];if(hits<3)caught()}}
 setTimeout(ghostStep,Math.max(200,320-got*20))}
function ghostDraw(){var X=gx*T+20,Y=gy*T+22,b=Math.sin(Date.now()/200)*2;x.fillStyle="#e8e0ff";x.strokeStyle="#2a0712";x.lineWidth=2;x.beginPath();x.arc(X,Y-2+b,13,Math.PI,0);x.lineTo(X+13,Y+13+b);x.lineTo(X+6,Y+9+b);x.lineTo(X,Y+13+b);x.lineTo(X-6,Y+9+b);x.lineTo(X-13,Y+13+b);x.closePath();x.fill();x.stroke();[-6,6].forEach(function(o){x.beginPath();x.arc(X+o,Y-4+b,5,0,7);x.fillStyle="#fff";x.fill();x.stroke()});x.beginPath();x.moveTo(X-1,Y-4+b);x.lineTo(X+1,Y-4+b);x.stroke();x.fillStyle="#2a0712";x.fillRect(X-7,Y-5+b,3,3);x.fillRect(X+5,Y-5+b,3,3);x.beginPath();x.arc(X,Y+4+b,3,0,Math.PI);x.stroke()}
ghostStep();
draw();
</script></body></html>
